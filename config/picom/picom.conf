# Backend: xrender o glx
backend = "glx";
vsync = true;

# Bordes redondeados
# rounded-corners = true;
# corner-radius = 20;

# Sombras
# shadow = true;
# shadow-radius = 15;
# shadow-opacity = 0.3;

# Blur del fondo
blur-method = "dual_kawase";
blur-size = 2;
blur-strength = 9;
blur-background = true;

opacity-rule = [
	"85:class_g= 'kitty'"
];

# Transiciones :D

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

fade-delta = 4;
