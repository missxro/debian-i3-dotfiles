enable_audio_bell no

include color.ini

# font_family HackNerdFont
font_family DepartureMono Nerd Font Mono
# symbol_map U+1F000-U+1FAFF Symbols Nerd Font
font_size 13

disable_ligatures never
# url_color #61afef

url_style curly

map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down

#Clipboard multiple (Portapapeles) Esto significa que tenemos dos portapapeles, lo que tenga en el buffer a (con f1 y f2) no se solapará con lo que tenga en el buffer b (f3 y f4)

map f1 copy_to_buffer a
#Copiar cadenas y almacenarlas en el buffer a
map f2 paste_from_buffer a
#Pegar esas cadenas
map f3 copy_to_buffer b
map f4 paste_from_buffer b


cursor_shape beam
cursor_beam_thickness 1.8

mouse_hide_wait 3.0
detect_urls yes
#Detecta URLs y puedes ir pinchando con el mouse desde la consola :oo

repaint_delay 10
input_delay 3
sync_to_monitor yes

map ctrl+shift+z toggle_layout stack
tab_bar_style powerline
#Formato de la barra de abajo
# inactive_tab_background #e06c75
# active_tab_background #98c379
# inactive_tab_foreground #000000
# tab_bar_margin_color black

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd

background_opacity 0.95

shell zsh


# BEGIN_KITTY_THEME
# Ayaka
include current-theme.conf
# END_KITTY_THEME
#
